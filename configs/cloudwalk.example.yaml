# Template for retargeting AnyChain to the CloudWalk network.
# Copy to configs/cloudwalk.yaml, fill every <PLACEHOLDER>, run with --config.
# No code changes are needed: everything network-specific lives in this file.
# Public facts (checked 2026-10-07):
#   - chainid.network lists CloudWalk Mainnet = 2009 and CloudWalk Testnet = 2008,
#     native currency CWN, explorers explorer.mainnet.cloudwalk.io / explorer.testnet.cloudwalk.io.
#   - Neither explorer is publicly reachable: mainnet redirects to cloudwalk.io and
#     testnet resolves to a private IP (10.x). The network is private, so the URLs
#     below must be the internal ones.
network:
  name: cloudwalk-mainnet          # free-text label shown in the UI and in logs
  chain_id: 2009                   # 2008 for CloudWalk Testnet; confirm with eth_chainId on the RPC
  native_symbol: CWN
  native_decimals: 18              # confirm with the network team
  # Set this to the CHAIN_TYPE your Blockscout runs with (ask its operator). A Stratus
  # network is a standard EVM, so "default" is the likely value. AnyChain warns if the
  # explorer's answers look like another type.
  chain_type: default

explorer:
  type: blockscout                 # any Blockscout-compatible API (v2)
  base_url: "<EXPLORER_BASE_URL>"  # internal URL; public name is https://explorer.mainnet.cloudwalk.io
  api_path: /api/v2
  tx_url_template: "{base_url}/tx/{hash}"
  address_url_template: "{base_url}/address/{address}"
  timeout_s: 15

rpc:
  # Stratus can reject unidentified clients (stratus_disableUnknownClients). It reads the
  # client name from ?app=<name> (or the x-app header), so keep the query string.
  url: "<RPC_URL>?app=anychain"    # read-only JSON-RPC endpoint
  timeout_s: 10
  # Stratus serves debug_traceTransaction (src/eth/rpc/server.rs); phase 2 uses it to
  # confirm failure points and code at execution time.
  supports_debug_trace: true

repos:
  # The BRLC contracts were public at github.com/cloudwalk/brlc-token until ~May 2024
  # (commits by @cloudwalk.io engineers; its .openzeppelin/ folder has deployments on
  # chains 2008 and 2009). The official repo now returns 404. A copy exists at
  # github.com/cloudwallk/brlc-token (unverified org, all repos pushed 2024-05-09),
  # pinned below to an exact commit. Prefer the internal official repo when available.
  - url: https://github.com/cloudwallk/brlc-token
    ref: 74a5498d04b10dc882e48273a38b98b4275463bd
    source_globs: ["contracts/**/*.sol"]
    artifact_globs: ["**/artifacts/**/*.json", "**/abi/**/*.json"]

# Stratus returns a gas price of zero (eth_gasPrice -> 0x0): fees will show as 0 CWN,
# which is correct for this network.
address_labels: {}                 # optional: "0x...": "BRLC token (proxy)"
address_map: {}                    # optional: "0x...": { repo: "<url>", contract: "<Name>" }

abi_strategy:
  order: [explorer, repo_artifacts, repo_source_signatures, signature_db]
  signature_db:
    enabled: false                 # keep off on a private network if policy requires it
    url: https://www.4byte.directory/api/v1

llm:
  provider: claude_code  # claude_code (local CLI, no key) | anthropic | openai (D27)
  model: claude-sonnet-5-5
  max_tokens: 2000
  temperature: 0

assistant:
  default_mode: support
  language: pt-BR
  max_clarifying_questions: 2
  time_budget_s: 30             # total wait for one explanation; then answer with what we have

storage:
  sqlite_path: data/runs.db
  cache_dir: data/cache
