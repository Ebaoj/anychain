network:
  name: rootstock-mainnet
  chain_id: 30
  native_symbol: RBTC
  native_decimals: 18
  chain_type: rsk           # Blockscout CHAIN_TYPE of this explorer

explorer:
  type: blockscout
  base_url: https://rootstock.blockscout.com
  api_path: /api/v2
  tx_url_template: "{base_url}/tx/{hash}"
  address_url_template: "{base_url}/address/{address}"
  timeout_s: 15

rpc:
  url: https://public-node.rsk.co
  timeout_s: 10
  supports_debug_trace: false

# Contract repositories cited as source (PHASE2 T6): each entry needs url, ref (a commit, or a
# branch resolved at sync time) and source_globs; run `anychain repos sync --config <this file>`.
repos: []

address_map: {}

# Rootstock native contracts (rsksmart/rskj, PrecompiledContracts.java): built into the node, so
# they have no bytecode, but the Bridge's ABI is published (rskj Bridge.java) and can be added
# through a configured repo. Every block ends with a system transaction from the zero address to REMASC.
native_contracts:
  "0x0000000000000000000000000000000001000006": "Rootstock Bridge (BTC peg)"
  "0x0000000000000000000000000000000001000008": "Rootstock REMASC (block rewards)"

abi_strategy:
  order: [explorer, repo_artifacts, repo_source_signatures, signature_db]
  signature_db:
    enabled: true
    url: https://www.4byte.directory/api/v1

llm:
  provider: claude_code  # claude_code (local CLI, no key) | anthropic | openai (D27)
  model: claude-sonnet-5-5
  max_tokens: 2000
  temperature: 0

assistant:
  default_mode: support
  language: pt-BR
  max_clarifying_questions: 1
  time_budget_s: 30             # total wait for one explanation; then answer with what we have

storage:
  sqlite_path: data/runs.db
  cache_dir: data/cache

# Real transactions of this network the page offers to try (each one is a recorded fixture, D64).
examples:
  - {label: "Token transfer", hash: "0x677c354e740f6bcbbd1ef6f4ea5ed0247c0fd711b85fc9a16798a07473756351"}
  - {label: "Failure: contract paused", hash: "0x9ca321afd6c436a285e4d26ebd7c3fe7b2474b878d8ee2b3efd005520b9906dd"}
  - {label: "Failure: price limit (slippage)", hash: "0x59f5c356dc0bf35db06d89e5aaa98b850bd21809f29662fcab5f980001d0b20d"}
