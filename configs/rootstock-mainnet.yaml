network:
  name: rootstock-mainnet
  chain_id: 30
  native_symbol: RBTC
  native_decimals: 18
  chain_type: rsk           # Blockscout CHAIN_TYPE of this explorer

explorer:
  type: blockscout
  base_url: https://rootstock.blockscout.com
  api_path: /api/v2
  tx_url_template: "{base_url}/tx/{hash}"
  address_url_template: "{base_url}/address/{address}"
  timeout_s: 15

rpc:
  url: https://public-node.rsk.co
  timeout_s: 10
  supports_debug_trace: false

repos:
  - url: https://github.com/Uniswap/v2-periphery
    ref: master
    source_globs: ["contracts/**/*.sol"]
    artifact_globs: ["**/artifacts/**/*.json", "**/out/**/*.json", "**/abi/**/*.json", "build/**/*.json"]
  - url: https://github.com/circlefin/stablecoin-evm
    ref: master
    source_globs: ["contracts/**/*.sol"]

address_map: {}

# Rootstock native contracts (rsksmart/rskj, PrecompiledContracts.java): built into the node,
# no bytecode or ABI. Every block ends with a system transaction from the zero address to REMASC.
native_contracts:
  "0x0000000000000000000000000000000001000006": "Rootstock Bridge (BTC peg)"
  "0x0000000000000000000000000000000001000008": "Rootstock REMASC (block rewards)"

abi_strategy:
  order: [explorer, repo_artifacts, repo_source_signatures, signature_db]
  signature_db:
    enabled: true
    url: https://www.4byte.directory/api/v1

llm:
  provider: anthropic
  model: claude-sonnet-5-5
  max_tokens: 2000
  temperature: 0

assistant:
  default_mode: support
  language: pt-BR
  max_clarifying_questions: 2
  time_budget_s: 30             # total wait for one explanation; then answer with what we have

storage:
  sqlite_path: data/runs.db
  cache_dir: data/cache
