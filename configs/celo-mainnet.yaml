network:
  name: celo-mainnet
  chain_id: 42220
  native_symbol: CELO
  native_decimals: 18
  chain_type: optimism-celo
  # CELO is also an ERC-20: a native send appears as a CELO token transfer too (verified on tx 0x64f5270e...)
  native_token_contract: "0x471EcE3750Da237f93B8E339c536989b8978a438" # Blockscout CHAIN_TYPE of this explorer

explorer:
  type: blockscout
  base_url: https://celo.blockscout.com
  api_path: /api/v2
  tx_url_template: "{base_url}/tx/{hash}"
  address_url_template: "{base_url}/address/{address}"
  timeout_s: 15

rpc:
  url: https://forno.celo.org
  timeout_s: 10
  supports_debug_trace: false

repos:
  - url: https://github.com/Uniswap/v2-periphery
    ref: master
    source_globs: ["contracts/**/*.sol"]
    artifact_globs: ["**/artifacts/**/*.json", "**/out/**/*.json", "**/abi/**/*.json", "build/**/*.json"]
  - url: https://github.com/circlefin/stablecoin-evm
    ref: master
    source_globs: ["contracts/**/*.sol"]

address_map: {}

# Fee adapters for 6-decimal tokens (docs.celo.org fee-currencies list). The fee is in the
# adapter's units: expectedDecimals()/adapterDecimals() read on-chain = 18 for all four.
fee_tokens:
  "0x0E2A3e05bc9A16F5292A6170456A710cb89C6f72": {symbol: "USD₮", decimals: 18, note: "through the USD₮ fee adapter (token 0x48065fbBE25f71C9282ddf5e1cD6D6A887483D5e)"}
  "0x2F25deB3848C207fc8E0c34035B3Ba7fC157602B": {symbol: "USDC", decimals: 18, note: "through Circle's USDC fee adapter (token 0xcebA9300f2b948710d2653dD7B07f33A8B32118C)"}
  "0x0357EE22278c922e1D36cFe6b899269b161880C4": {symbol: "USA₮", decimals: 18, note: "through the USA₮ fee adapter (token 0xD2ab3C9A02DBBAB236BfEC45D1d755DF4267F771)"}
  "0x857BF24e29da0773687E804a743c2E421a394C16": {symbol: "XAUt0", decimals: 18, note: "through the XAUt0 fee adapter (token 0xaf37E8B6C9ED7f6318979f56Fc287d76c30847ff)"}

# OP Stack predeploys (ethereum-optimism/optimism, contracts-bedrock/src/libraries/Predeploys.sol)
# and the depositor system account (L1Block.DEPOSITOR_ACCOUNT, seen live as the sender of the
# L1 attributes transaction at the start of every block).
address_labels:
  "0xdeaddeaddeaddeaddeaddeaddeaddeaddead0001": "OP Stack depositor system account (sequencer, not a user)"
  "0x420000000000000000000000000000000000000f": "OP Stack GasPriceOracle predeploy"
  "0x4200000000000000000000000000000000000010": "OP Stack L2StandardBridge predeploy"
  "0x4200000000000000000000000000000000000011": "OP Stack SequencerFeeVault predeploy"
  "0x4200000000000000000000000000000000000015": "OP Stack L1Block predeploy (L1 attributes)"
  "0x4200000000000000000000000000000000000016": "OP Stack L2ToL1MessagePasser predeploy (withdrawals)"
  "0x4200000000000000000000000000000000000019": "OP Stack BaseFeeVault predeploy"
  "0x420000000000000000000000000000000000001a": "OP Stack L1FeeVault predeploy"

abi_strategy:
  order: [explorer, repo_artifacts, repo_source_signatures, signature_db]
  signature_db:
    enabled: true
    url: https://www.4byte.directory/api/v1

llm:
  provider: anthropic
  model: claude-sonnet-5-5
  max_tokens: 2000
  temperature: 0

assistant:
  default_mode: support
  language: pt-BR
  max_clarifying_questions: 2
  time_budget_s: 30             # total wait for one explanation; then answer with what we have

storage:
  sqlite_path: data/runs.db
  cache_dir: data/cache
