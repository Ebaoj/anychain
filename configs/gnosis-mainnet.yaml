network:
  name: gnosis-mainnet
  chain_id: 100
  native_symbol: XDAI
  native_decimals: 18
  chain_type: ethereum      # Blockscout CHAIN_TYPE: its transactions carry the blob fields (blob_gas_used,
                            # burnt_blob_fee...), seen on tx 0xda8a55bc... (recorded gnosis_blob_fee, 2026-10-08, D54)

explorer:
  type: blockscout
  base_url: https://gnosisscan.io   # moved from gnosis.blockscout.com (HTTP 301) on 2026-10-07; same Blockscout v12
  api_path: /api/v2
  tx_url_template: "{base_url}/tx/{hash}"
  address_url_template: "{base_url}/address/{address}"
  timeout_s: 15

rpc:
  url: https://rpc.gnosischain.com
  timeout_s: 10
  supports_debug_trace: false

# Contract repositories cited as source (PHASE2 T6): each entry needs url, ref (a commit, or a
# branch resolved at sync time) and source_globs; run `anychain repos sync --config <this file>`.
repos: []

address_map: {}

abi_strategy:
  order: [explorer, repo_artifacts, repo_source_signatures, signature_db]
  signature_db:
    enabled: true
    url: https://www.4byte.directory/api/v1

llm:
  provider: claude_code  # claude_code (local CLI, no key) | anthropic | openai (D27)
  model: claude-sonnet-5-5
  max_tokens: 2000
  temperature: 0

assistant:
  default_mode: support
  language: pt-BR
  max_clarifying_questions: 1
  time_budget_s: 30             # total wait for one explanation; then answer with what we have

storage:
  sqlite_path: data/runs.db
  cache_dir: data/cache
