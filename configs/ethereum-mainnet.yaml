network:
  name: ethereum-mainnet
  chain_id: 1
  native_symbol: ETH
  native_decimals: 18
  chain_type: ethereum      # Blockscout CHAIN_TYPE of this explorer

explorer:
  type: blockscout
  base_url: https://eth.blockscout.com
  api_path: /api/v2
  tx_url_template: "{base_url}/tx/{hash}"
  address_url_template: "{base_url}/address/{address}"
  timeout_s: 15

rpc:
  url: https://ethereum-rpc.publicnode.com
  timeout_s: 10
  supports_debug_trace: false

# Contract repositories cited as source (PHASE2 T6). Run `anychain repos sync --config <this file>`
# once to download them into storage.cache_dir; `explain` only reads that cache.
# BRLC (CloudWalk's token, also deployed on Ethereum: proxy 0xAC176d9e75384F7d71275bb9D5265281CC0Dd284,
# implementation BRLCTokenBridgeable). The official repo returns 404 since ~May 2024; this is an
# unofficial mirror, approved for the demo by Joabe on 2026-10-08, pinned to an exact commit. It is a
# later version than the deployed code (compiler 0.8.24 in the repo, 0.8.16 in the verified source).
repos:
  - url: https://github.com/cloudwallk/brlc-token
    ref: 74a5498d04b10dc882e48273a38b98b4275463bd
    source_globs: ["contracts/**/*.sol"]
  # Uniswap's official V2 router source (GPL-3.0), pinned to the master commit of 2026-04-02 checked with the GitHub API
  # on 2026-10-09. Only the router's file: its interfaces (IERC20, IWETH) would make every token call a "selector
  # found in a repository" candidate, and contracts/test/ defines a WETH9 that is not the deployed WETH9.
  - url: https://github.com/Uniswap/v2-periphery
    ref: ed24991304291297c3b4a52818d02f46a17aa9a2
    source_globs: ["contracts/UniswapV2Router02.sol"]
  # Safe's official deployments: compiled ABIs only, no Solidity source (PHASE2_5 T3, D40).
  - url: https://github.com/safe-global/safe-deployments
    ref: 7b1fb6d615ab2d2999550ec9166554b180e813e5
    source_globs: []
    artifact_globs: ["src/assets/v1.4.1/*.json"]

# The two Safe addresses are the "canonical" deployments listed in that repo's src/assets/v1.4.1/
# safe_proxy_factory.json and safe.json at the pinned commit.
address_map:
  "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67": { repo: https://github.com/safe-global/safe-deployments, contract: SafeProxyFactory }
  "0x41675C099F32341bf84BFc5382aF534df5C7461a": { repo: https://github.com/safe-global/safe-deployments, contract: Safe }

abi_strategy:
  order: [explorer, repo_artifacts, repo_source_signatures, signature_db]
  signature_db:
    enabled: true
    url: https://www.4byte.directory/api/v1

llm:
  provider: claude_code  # claude_code (local CLI, no key) | anthropic | openai (D27)
  model: claude-sonnet-5-5
  max_tokens: 2000
  temperature: 0

assistant:
  default_mode: support
  language: pt-BR
  max_clarifying_questions: 1
  time_budget_s: 30             # total wait for one explanation; then answer with what we have

storage:
  sqlite_path: data/runs.db
  cache_dir: data/cache

# Real transactions of this network the page offers to try (each one is a recorded fixture, D64).
examples:
  - {label: "USDC transfer that succeeded", hash: "0x7909bd56b9a3a0e932fa20ccd7093fcafcad133c51af652c921cd329b2307952"}
  - {label: "Uniswap swap that succeeded", hash: "0x08b39d3ae20b5c09294209ad4c0bf8e6d14bf660f81ffa6696c455911aa46c6a"}
  - {label: "Swap that failed: deadline passed", hash: "0x73c4c0385483897a8c3cca6e4573c880dab32265bbacd94923fff2466cb45c8a"}
  - {label: "Transfer that ran out of gas", hash: "0x0660a8a28446773a8b76f41e9802995da09713db7ee557cc6c7f4a177fc8fd81"}
  - {label: "Failure on an unverified contract", hash: "0x68098e2a69deadd1f60396d667781517a5cfdf257a5e35f79f0c47c52f5f51c9"}
