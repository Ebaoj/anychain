# AnyChain private demo network (PHASE4 T6): Anvil + Blockscout backend only. Everything on 127.0.0.1.
name: anychain-devnet
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    ports: ["127.0.0.1:8545:8545"]
    mem_limit: 300m
  db:
    image: postgres:17
    environment: {POSTGRES_DB: blockscout, POSTGRES_USER: blockscout, POSTGRES_PASSWORD: devnet-only-local}
    command: postgres -c max_connections=60
    shm_size: 128m
    mem_limit: 512m
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"], interval: 10s, retries: 10}
  redis:
    image: redis:alpine
    mem_limit: 64m
  backend:
    image: ghcr.io/blockscout/blockscout:latest
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    env_file: [blockscout/docker-compose/envs/common-blockscout.env]
    environment:
      ETHEREUM_JSONRPC_VARIANT: anvil
      ETHEREUM_JSONRPC_HTTP_URL: http://anvil:8545/
      ETHEREUM_JSONRPC_TRACE_URL: http://anvil:8545/
      ETHEREUM_JSONRPC_WS_URL: ws://anvil:8545/
      DATABASE_URL: postgresql://blockscout:devnet-only-local@db:5432/blockscout?sslmode=disable
      ECTO_USE_SSL: "false"
      ECTO_SSL_MODE: disable
      ACCOUNT_REDIS_URL: redis://redis:6379
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      CHAIN_ID: "31337"
      COIN: ETH
      POOL_SIZE: "20"
      POOL_SIZE_API: "5"
      MICROSERVICE_SIG_PROVIDER_ENABLED: "false"
      MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: "false"
      MICROSERVICE_SC_VERIFIER_ENABLED: "false"
      DISABLE_FILE_LOGGING: "true"
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}, anvil: {condition: service_started}}
    ports: ["127.0.0.1:4000:4000"]
    mem_limit: 1200m
