[project]
name = "anychain"
version = "0.1.0"
description = "Configurable AI assistant that explains and troubleshoots EVM transactions"
readme = "README.md"
requires-python = ">=3.11.4"  # tarfile extraction filters (repo cache)
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "eth-abi>=5.0",
    "eth-utils>=4.1",
    "eth-hash[pycryptodome]>=0.7",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
anychain = "anychain.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
